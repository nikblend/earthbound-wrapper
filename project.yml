#
# project.yml — EarthboundWrapper
#
# The Xcode project is generated, not committed. There is exactly one target, a
# handful of build settings, and a static library per SDK; keeping that in a
# 60-line YAML file means re-pinning the emulator core or adding a file never
# turns into a merge conflict on a 4000-line pbxproj.
#
#   brew install xcodegen
#   ./scripts/build-core.sh          # builds Core/lib/<sdk>/libsnes9x.a
#   xcodegen generate
#   open EarthboundWrapper.xcodeproj
#

name: EarthboundWrapper

options:
  bundleIdPrefix: dev.nikan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    # Swift 5 language mode with minimal concurrency checking, deliberately.
    # The real-time paths in this app (audio render block, emulation thread,
    # CoreHaptics callbacks) are hand-synchronised, and strict checking would
    # demand annotations that describe the synchronisation without improving it.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GCC_C_LANGUAGE_STANDARD: gnu11
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    # The core's own sources are not ours to lint, and it ships warnings by design.
    GCC_WARN_ABOUT_RETURN_TYPE: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO
    # Without this, Xcode's script phases refuse to see anything outside the
    # sandbox, which breaks the header search path into Sources/Support.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_BITCODE: NO
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    # No third-party packages, so nothing to resolve.
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  EarthboundWrapper:
    type: application
    platform: iOS

    sources:
      - path: Sources
        excludes:
          - "Support/EBCoreGlue.h"
          - "Support/BridgingHeader.h"
      # Declared with no build phase: headers Swift needs to see, but which must
      # not end up in a copy-resources phase.
      - path: Sources/Support/EBCoreGlue.h
        buildPhase: none
      - path: Sources/Support/BridgingHeader.h
        buildPhase: none
      - path: ThirdParty/libretro/include/libretro.h
        buildPhase: none
      # Generated by scripts/make-assets.py rather than committed as a binary
      # blob: four circles and a rounded rectangle do not need to live in git.
      - path: Resources

    settings:
      base:
        PRODUCT_NAME: EarthboundWrapper
        PRODUCT_BUNDLE_IDENTIFIER: dev.nikan.earthbound
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

        SWIFT_OBJC_BRIDGING_HEADER: Sources/Support/BridgingHeader.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Sources/Support

        # One static archive per SDK, produced by scripts/build-core.sh. Static
        # linking rather than `dlopen`: no nested binary to sign, no bundle copy
        # phase, and a missing symbol becomes a link error instead of a runtime
        # failure on the player's device.
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/Core/lib/iphoneos
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/Core/lib/iphonesimulator

        # -lsnes9x is the core; -lc++ is its standard library, which the C++ core
        # needs and a Swift-only link would not otherwise pull in.
        OTHER_LDFLAGS: -lsnes9x -lc++

        # Signing is deliberately not configured here. The scripts and CI pass
        # CODE_SIGNING_ALLOWED=NO to produce an unsigned app that a sideloading
        # tool re-signs with the player's own identity, and a local device build
        # can set a development team in Xcode without fighting this file.

      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          GCC_OPTIMIZATION_LEVEL: "0"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"

    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreHaptics.framework
      - sdk: CoreGraphics.framework

    info:
      path: Support/Info.plist
      # Merged over XcodeGen's defaults, so CFBundleExecutable and the rest are
      # still generated correctly.
      properties:
        CFBundleDisplayName: Earthbound Wrapper
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Dark
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        # Landscape only. The controls are laid out for two thumbs on the long
        # edges, and a SNES frame in portrait would be a postage stamp.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIColorName: ""
        ITSAppUsesNonExemptEncryption: false
        # Makes the app's Documents folder visible in Files, which is how a player
        # drops a ROM in without using the share sheet.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Super Nintendo ROM
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - dev.nikan.earthbound.snes-rom
        # Exported, not imported: this app defines this UTI, and iOS only
        # associates a file extension with a type whose declaring app claims it
        # outright. Declared as imported, `.sfc` resolves to this identifier for a
        # picker while the file on disk keeps a dynamic type, so nothing matches and
        # every ROM shows up greyed out and unselectable.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.nikan.earthbound.snes-rom
            UTTypeDescription: Super Nintendo ROM
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - sfc
                - smc
                - fig
                - swc
              public.mime-type:
                - application/x-snes-rom

# Declared explicitly rather than left to Xcode's autocreate-schemes, so that
# `xcodebuild -scheme EarthboundWrapper` works on a fresh CI checkout that was
# never opened in the IDE.
schemes:
  EarthboundWrapper:
    build:
      targets:
        EarthboundWrapper: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
